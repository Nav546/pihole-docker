# Pi-hole (network-wide DNS ad blocker) running as a container.
# Image is pulled from Docker Hub - no Dockerfile needed for this project.
services:
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    ports:
      # DNS (TCP + UDP)
      - "53:53/tcp"
      - "53:53/udp"
      # Web admin UI. Mapped to 8080 to avoid clashing with anything on port 80.
      - "8080:80/tcp"
      - "8443:443/tcp"
    environment:
      TZ: ${TZ:-Australia/Melbourne}
      # Admin password comes from the .env file (never hardcode it in this file).
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      # Required when Docker uses its default bridge network.
      FTLCONF_dns_listeningMode: "all"
    volumes:
      # Named volume: keeps Pi-hole's config, blocklists and query database
      # between restarts and image upgrades.
      - pihole_data:/etc/pihole
    restart: unless-stopped

volumes:
  pihole_data:
